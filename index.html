<!DOCTYPE html>

<html>

    <head>
        <title>Möly</title>
        <link rel="stylesheet" href="Main/Style/index.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <div class="title">
            <h1>Möly</h1>
        </div>

        <form class="login-form">
            <h2>Tervetuloa</h2>

            <div class="login-username">
                <label for="username">Käyttäjänimi</label>
                <input type="text" id="username">
            </div>

            <div class="login-password">
                <label for="password">Salasana</label>
                <input type="password" id="password">
            </div>

            <button class="login-button" type="submit">Kirjaudu sisään</button>
            <button class="register-button" type="submit">Rekisteröidy</button>
        </form>
    </body>

    <script src="Main/Script/index.js"></script>
</html>
